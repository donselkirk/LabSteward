name: PR Verification and Main Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release bundle to publish
        required: true
        type: choice
        options: [updater-bridge, core]
      version:
        description: Explicit semantic version, including the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: labsteward-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
      - name: Fetch reviewed Community Scripts helpers
        run: bash tools/fetch-community-helpers.sh
      - name: Verify generated files and behavior
        run: |
          bash tools/build-artifacts.sh
          git diff --exit-code
          bash tests/static-checks.sh
          bash tests/manager-behavior.sh
          python3 tests/sanitizer-behavior.py
          python3 tests/log-behavior.py
          python3 tests/oauth-behavior.py
          bash tests/self-update-behavior.sh
          bash tests/updater-bridge-behavior.sh
          shellcheck labsteward.sh ct/labsteward.sh src/self-update.sh tools/*.sh tests/*.sh
          git diff --check
          test -s AI_SPEC.md
          for required in \
            'stewctl update' 'Security invariants' 'Data contracts' \
            'Testing contract' 'Specification validation' 'LABSteward'; do
            grep -q "$required" AI_SPEC.md
          done

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate explicit release request
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${{ inputs.release_type }}" == "updater-bridge" ]]; then
            grep -qx "bridge_version=${{ inputs.version }}" release/COMPATIBILITY
          else
            bridge="$(sed -n 's/^bridge_version=//p' release/COMPATIBILITY)"
            git rev-parse -q --verify "refs/tags/${bridge}" >/dev/null || {
              echo "Publish the required updater bridge ${bridge} before the core release." >&2
              exit 1
            }
          fi
          if git rev-parse -q --verify "refs/tags/${{ inputs.version }}" >/dev/null; then
            echo "Release tag already exists: ${{ inputs.version }}" >&2
            exit 1
          fi
      - name: Build checksummed release assets
        run: |
          bash tools/fetch-community-helpers.sh
          bash tools/build-artifacts.sh
          if [[ "${{ inputs.release_type }}" == "updater-bridge" ]]; then
            bash tools/build-updater-bridge.sh "${{ inputs.version }}" dist
          else
            bash tools/build-release-assets.sh "${{ inputs.version }}" dist
          fi
      - name: Generate release notes
        run: |
          {
            printf '## Important changes\n\n'
            if [[ "${{ inputs.release_type }}" == "updater-bridge" ]]; then
              printf '%s\n' '- Updater-only compatibility bridge; does not enable OAuth or the administrator interface.'
              printf '%s\n' '- Apply this release before v0.2.0 when upgrading from v0.1.0-v0.1.2.'
            else
              previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
              if [[ -n "$previous" ]]; then
                git log --reverse --no-merges --pretty='format:- %s (`%h`)' "${previous}..${GITHUB_SHA}"
              else
                git log --reverse --no-merges --pretty='format:- %s (`%h`)' "$GITHUB_SHA"
              fi
            fi
            printf '\n\n## Security model\n\n'
            printf 'Plugins are checksummed release assets. Server targets and permissions remain explicit, and credentials are not included in releases.\n'
          } >dist/RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          latest_flag=--latest
          [[ "${{ inputs.release_type }}" == "updater-bridge" ]] && latest_flag=--latest=false
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "LabSteward $VERSION" --notes-file dist/RELEASE_NOTES.md "$latest_flag"
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p published
          gh release download "$VERSION" --dir published
          cmp dist/VERSION published/VERSION
          cmp dist/SHA256SUMS published/SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS)
