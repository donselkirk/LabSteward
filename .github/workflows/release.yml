name: PR Verification and Main Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: labsteward-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
      - name: Fetch reviewed Community Scripts helpers
        run: bash tools/fetch-community-helpers.sh
      - name: Verify generated files and behavior
        run: |
          bash tools/build-artifacts.sh
          git diff --exit-code
          bash tests/static-checks.sh
          bash tests/manager-behavior.sh
          bash tests/self-update-behavior.sh
          shellcheck labsteward.sh ct/labsteward.sh src/self-update.sh tools/*.sh tests/*.sh
          git diff --check

  release:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve an idempotent patch version
        id: version
        shell: bash
        run: |
          existing="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [[ -n "$existing" ]]; then
            next="$existing"
            exists=true
            previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "$existing" | sed -n '1p')"
          else
            previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
            if [[ -z "$previous" ]]; then
              next="v0.1.0"
            else
              IFS=. read -r major minor patch <<<"${previous#v}"
              next="v${major}.${minor}.$((patch + 1))"
            fi
            exists=false
          fi
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
          echo "exists=$exists" >>"$GITHUB_OUTPUT"
      - name: Build checksummed release assets
        run: |
          bash tools/fetch-community-helpers.sh
          bash tools/build-artifacts.sh
          bash tools/build-release-assets.sh "${{ steps.version.outputs.version }}" dist
      - name: Generate release notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          {
            printf '## Important changes\n\n'
            if [[ -n "$PREVIOUS" ]]; then
              git log --reverse --no-merges --pretty='format:- %s (`%h`)' "${PREVIOUS}..${GITHUB_SHA}"
            else
              git log --reverse --no-merges --pretty='format:- %s (`%h`)' "$GITHUB_SHA"
            fi
            printf '\n\n## Security model\n\n'
            printf 'Plugins are checksummed release assets. Server targets and permissions remain explicit, and credentials are not included in releases.\n'
          } >dist/RELEASE_NOTES.md
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "LabSteward $VERSION" --notes-file dist/RELEASE_NOTES.md
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p published
          gh release download "$VERSION" --dir published
          cmp dist/VERSION published/VERSION
          cmp dist/SHA256SUMS published/SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS)
